<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DaMe repo pre Kodi</title>
  <style>body{font-family:Arial; padding:20px;} a{display:block; padding:8px; font-size:18px;}</style>
</head>
<body>
  <h1>adresare</h1>
  <script>
    // Automaticky vygeneruje zoznam všetkých súborov a priečinkov z raw.githubusercontent.com
    const repo = "dametest-git/mykodirepo";  // ← ZMEŇ na svoje!
    const branch = "main";                  // alebo master

    fetch(`https://api.github.com/repos/${repo}/git/trees/${branch}?recursive=1`)
      .then(r => r.json())
      .then(data => {
        const ul = document.createElement('ul');
        data.tree.forEach(item => {
          if (item.type === "blob" && item.path.includes(".")) {  // len súbory s príponou
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = `https://raw.githubusercontent.com/${repo}/${branch}/${item.path}`;
            a.textContent = item.path;
            a.target = "_blank";
            li.appendChild(a);
            ul.appendChild(li);
          }
        });
        document.body.appendChild(ul);
      });
  </script>
</body>
</html>
